name: Deploy to Droplet

# Make the run title say WHICH app is deploying. A push to main/WhiteLabel shows
# the branch; the app-wl (Smadav) deploy is dispatched by the Sync workflow as a
# workflow_dispatch, so show its `app` input — otherwise it just reads "Deploy to
# Droplet" and looks like the Smadav bot never redeployed.
run-name: >-
  Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.app || (github.ref_name == 'WhiteLabel' && 'app-wl (Smadav)' || 'app-main (Nomadly)') }}

# Auto-deploy: a push to `main` or `WhiteLabel` that touches runtime files
# ships to the DigitalOcean droplet. The runner SSHes in and runs
# /opt/nomadly/deploy.sh (git sync + smart deps + pm2 restart + /health
# check with auto-rollback).
# Canonical deploy logic: scripts/droplet_deploy.sh (self-installs on the
# box after each sync).
on:
  push:
    # app-main follows main again (droplet: shared/app-main/branch = main); WITH-WEBIVR was merged into main 2026-10-23.
    branches: [main, WhiteLabel, WITH-WEBIVR]
    # Docs / memory / reports never need a production restart.
    paths-ignore:
      - 'memory/**'
      - '.emergent/**'
      - 'test_reports/**'
      - 'investigations/**'
      - '**.md'
      # CI/workflow files + the WhiteLabel sync tooling never run on the droplet.
      - '.github/**'
      - '.whitelabel-sync'
      - 'scripts/sync_whitelabel.py'
      - 'scripts/test_sync_whitelabel.sh'
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to deploy (app-main, app-wl, app-voodoo, app-proshop, whitelabel = app-wl → app-voodoo → app-proshop, or both = all)'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - app-main
          - app-wl
          - app-voodoo
          - app-proshop
          - whitelabel

# The job only SSHes out — it needs no GITHUB_TOKEN permissions at all.
permissions: {}

# One queue PER APP (job-level `concurrency` below). A single shared group made GitHub cancel
# the pending app-main deploy whenever the white-label deploy queued behind it, so Nomadly /
# CloudIVR stayed on an old release. A newer run of the SAME app may still replace a pending
# one — fine, deploy.sh always ships the newest commit. deploy.sh itself takes a box-wide lock,
# so two builds never run at once on the 2-vCPU droplet.

jobs:
  deploy-main:
    name: Deploy app-main (branch from droplet shared/app-main/branch — main)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: droplet-deploy-app-main
      cancel-in-progress: false
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/WITH-WEBIVR')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.app == 'both' || github.event.inputs.app == 'app-main'))
    env:
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      DROPLET_USER: ${{ secrets.DROPLET_USER }}
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=6 \
              "$DROPLET_USER@$DROPLET_HOST" \
              'bash /opt/nomadly/deploy.sh app-main'

  deploy-wl:
    name: Deploy app-wl (branch WhiteLabel)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: droplet-deploy-app-wl
      cancel-in-progress: false
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/WhiteLabel') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.app == 'both' || github.event.inputs.app == 'app-wl' || github.event.inputs.app == 'whitelabel'))
    env:
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      DROPLET_USER: ${{ secrets.DROPLET_USER }}
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=6 \
              "$DROPLET_USER@$DROPLET_HOST" \
              'bash /opt/nomadly/deploy.sh app-wl'

  deploy-voodoo:
    name: Deploy app-voodoo (Voodoo Land, branch WhiteLabel)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: droplet-deploy-app-voodoo
      cancel-in-progress: false
    # After app-wl (never two builds at once on the 2-vCPU box); still runs when app-wl was skipped or failed.
    needs: deploy-wl
    if: >-
      !cancelled() && (
      (github.event_name == 'push' && github.ref == 'refs/heads/WhiteLabel') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.app == 'both' || github.event.inputs.app == 'app-voodoo' || github.event.inputs.app == 'whitelabel')))
    env:
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      DROPLET_USER: ${{ secrets.DROPLET_USER }}
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=6 \
              "$DROPLET_USER@$DROPLET_HOST" \
              'bash /opt/nomadly/deploy.sh app-voodoo'

  deploy-proshop:
    name: Deploy app-proshop (PROSHOP, branch WhiteLabel)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: droplet-deploy-app-proshop
      cancel-in-progress: false
    # After app-voodoo (never two builds at once on the 2-vCPU box); still runs when an earlier brand was skipped or failed.
    needs: deploy-voodoo
    if: >-
      !cancelled() && (
      (github.event_name == 'push' && github.ref == 'refs/heads/WhiteLabel') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.app == 'both' || github.event.inputs.app == 'app-proshop' || github.event.inputs.app == 'whitelabel')))
    env:
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      DROPLET_USER: ${{ secrets.DROPLET_USER }}
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=6 \
              "$DROPLET_USER@$DROPLET_HOST" \
              'bash /opt/nomadly/deploy.sh app-proshop'

  # After every deploy: each bot that was meant to update must be on the newest commit of its branch and healthy.
  # Behind/unhealthy → deploy.sh once more → re-check. One Telegram message to the admin per run.
  verify:
    name: Verify every deployed bot is current + healthy (retry once, Telegram report)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [deploy-main, deploy-wl, deploy-voodoo, deploy-proshop]
    if: >-
      !cancelled() && (needs.deploy-main.result != 'skipped' || needs.deploy-wl.result != 'skipped' ||
      needs.deploy-voodoo.result != 'skipped' || needs.deploy-proshop.result != 'skipped')
    env:
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      DROPLET_USER: ${{ secrets.DROPLET_USER }}
      APPS: >-
        ${{ needs.deploy-main.result != 'skipped' && 'app-main' || '' }}
        ${{ needs.deploy-wl.result != 'skipped' && 'app-wl' || '' }}
        ${{ needs.deploy-voodoo.result != 'skipped' && 'app-voodoo' || '' }}
        ${{ needs.deploy-proshop.result != 'skipped' && 'app-proshop' || '' }}
      TITLE: ${{ github.event_name == 'workflow_dispatch' && format('Deploy {0}', inputs.app) || format('Deploy from {0} ({1})', github.ref_name, github.sha) }}
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify + retry + report
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              "$DROPLET_USER@$DROPLET_HOST" \
              "bash /opt/nomadly/current/app-main/scripts/deploy_verify.sh '${TITLE:0:60}' $(echo $APPS)"
