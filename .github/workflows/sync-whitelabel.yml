name: Sync main → WhiteLabel

# Brand-safe sync. Carries every CODE change made on `main` since the last sync
# over to the `WhiteLabel` branch (Smadav bot, app-wl), keeps every Smadav/
# brand-owned file untouched, STOPS without pushing on any real conflict (the
# run turns red and GitHub emails the owner), then redeploys app-wl through the
# normal "Deploy to Droplet" workflow.
#
# Runs AUTOMATICALLY on every push to main (i.e. every "Save to GitHub") that
# touches more than docs/notes. To pause auto-sync without a code change:
#   GitHub → Settings → Secrets and variables → Actions → Variables →
#   New repository variable  WL_AUTO_SYNC = false
# Manual run / preview: Actions → "Sync main → WhiteLabel" → Run workflow.
# Logic lives in scripts/sync_whitelabel.py (testable locally with --dry-run).
on:
  push:
    branches: [main]
    # Notes-only saves have no code to carry over.
    paths-ignore:
      - 'memory/**'
      - '.emergent/**'
      - 'test_reports/**'
      - 'investigations/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only — show what would change, push nothing'
        type: boolean
        default: false
      deploy:
        description: 'Redeploy the Smadav bot (app-wl) after syncing'
        type: boolean
        default: true

permissions:
  contents: write   # push the sync commit to WhiteLabel (fast-forward only)
  actions: write    # start the "Deploy to Droplet" workflow for app-wl

# One sync at a time; a newer save simply queues behind (each run syncs up to
# the newest main, so nothing is lost).
concurrency:
  group: sync-whitelabel
  cancel-in-progress: false

jobs:
  sync:
    name: Sync main → WhiteLabel
    # Automatic again (2026-11-05): CloudIVR-web-only files (js/cloudivr-web/*, frontend/src/cloudivr/*, the web
    # app shell) stay on main unless bot code needs them — see WEB_ONLY_PATTERNS in scripts/sync_whitelabel.py.
    # Pause without a code change: repository variable WL_AUTO_SYNC = false.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.WL_AUTO_SYNC != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch latest main + WhiteLabel
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/WhiteLabel:refs/remotes/origin/WhiteLabel

      - name: Node (for the post-merge syntax check)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync (brand-safe 3-way)
        id: sync
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          # push events have no inputs → dry_run is empty → --push
          MODE_FLAG: ${{ inputs.dry_run && '--dry-run' || '--push' }}
          SYNC_NOTE_FILE: ${{ github.workspace }}/sync-note.txt
        run: |
          python3 scripts/sync_whitelabel.py \
            --source origin/main --target origin/WhiteLabel \
            --remote origin --target-branch WhiteLabel "$MODE_FLAG"

      # Pushes made with GITHUB_TOKEN never trigger `on: push` workflows, so the
      # deploy is started explicitly (workflow_dispatch IS allowed for GITHUB_TOKEN).
      # --ref main = use main's canonical deploy.yml; deploy.sh app-wl always ships
      # the WhiteLabel branch (/opt/nomadly/shared/app-wl/branch).
      # Automatic (push) runs always redeploy; manual runs honour the `deploy` box.
      - name: Redeploy app-wl (Smadav bot) + app-voodoo (Voodoo Land) + app-proshop (PROSHOP)
        if: ${{ steps.sync.outputs.pushed == 'true' && steps.sync.outputs.runtime_changed == 'true' && (github.event_name == 'push' || inputs.deploy) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # whitelabel = app-wl (Smadav) → app-voodoo (Voodoo Land) → app-proshop (PROSHOP) in ONE run — all ship the WhiteLabel
          # branch with their own backend.env. One dispatch, so a queued run can't cancel the other.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f app=whitelabel
          echo "### 🚢 Started \"Deploy to Droplet\" for app-wl + app-voodoo + app-proshop — see the Actions tab" >> "$GITHUB_STEP_SUMMARY"

      # Telegram note to the Nomadly admin chat: what reached the 3 bots, what stayed web-only (or why it stopped).
      # Sent from the droplet with app-main's own bot token / TELEGRAM_ADMIN_CHAT_ID (no extra GitHub secrets).
      - name: Telegram sync note → Nomadly admin
        if: ${{ always() && !inputs.dry_run && hashFiles('sync-note.txt') != '' }}
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_SSH_KNOWN_HOSTS }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$DROPLET_USER@$DROPLET_HOST" 'f=/opt/nomadly/shared/app-main/backend.env
              v(){ grep -E "^$1=" "$f" | tail -1 | cut -d= -f2- | tr -d "\"\r"; }
              T=$(v TELEGRAM_BOT_TOKEN_PROD); C=$(v TELEGRAM_ADMIN_CHAT_ID)
              [ -n "$T" ] && [ -n "$C" ] && curl -s -m 15 -o /dev/null -w "telegram %{http_code}\n" \
                "https://api.telegram.org/bot$T/sendMessage" -d chat_id="$C" --data-urlencode text@-' < "${{ github.workspace }}/sync-note.txt" || true
