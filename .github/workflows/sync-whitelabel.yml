name: Sync main → WhiteLabel

# Brand-safe sync. Carries every CODE change made on `main` since the last sync
# over to the `WhiteLabel` branch (Smadav bot, app-wl), keeps every Smadav/
# brand-owned file untouched, STOPS without pushing on any real conflict (the
# run turns red and GitHub emails the owner), then redeploys app-wl through the
# normal "Deploy to Droplet" workflow.
#
# Runs AUTOMATICALLY on every push to main (i.e. every "Save to GitHub") that
# touches more than docs/notes. To pause auto-sync without a code change:
#   GitHub → Settings → Secrets and variables → Actions → Variables →
#   New repository variable  WL_AUTO_SYNC = false
# Manual run / preview: Actions → "Sync main → WhiteLabel" → Run workflow.
# Logic lives in scripts/sync_whitelabel.py (testable locally with --dry-run).
on:
  push:
    branches: [main]
    # Notes-only saves have no code to carry over.
    paths-ignore:
      - 'memory/**'
      - '.emergent/**'
      - 'test_reports/**'
      - 'investigations/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only — show what would change, push nothing'
        type: boolean
        default: false
      deploy:
        description: 'Redeploy the Smadav bot (app-wl) after syncing'
        type: boolean
        default: true

permissions:
  contents: write   # push the sync commit to WhiteLabel (fast-forward only)
  actions: write    # start the "Deploy to Droplet" workflow for app-wl

# One sync at a time; a newer save simply queues behind (each run syncs up to
# the newest main, so nothing is lost).
concurrency:
  group: sync-whitelabel
  cancel-in-progress: false

jobs:
  sync:
    name: Sync main → WhiteLabel
    # Manual runs always go; automatic runs unless WL_AUTO_SYNC is set to 'false'.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.WL_AUTO_SYNC != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch latest main + WhiteLabel
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/WhiteLabel:refs/remotes/origin/WhiteLabel

      - name: Node (for the post-merge syntax check)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync (brand-safe 3-way)
        id: sync
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          # push events have no inputs → dry_run is empty → --push
          MODE_FLAG: ${{ inputs.dry_run && '--dry-run' || '--push' }}
        run: |
          python3 scripts/sync_whitelabel.py \
            --source origin/main --target origin/WhiteLabel \
            --remote origin --target-branch WhiteLabel "$MODE_FLAG"

      # Pushes made with GITHUB_TOKEN never trigger `on: push` workflows, so the
      # deploy is started explicitly (workflow_dispatch IS allowed for GITHUB_TOKEN).
      # --ref main = use main's canonical deploy.yml; deploy.sh app-wl always ships
      # the WhiteLabel branch (/opt/nomadly/shared/app-wl/branch).
      # Automatic (push) runs always redeploy; manual runs honour the `deploy` box.
      - name: Redeploy app-wl (Smadav bot) + app-voodoo (Voodoo Land)
        if: ${{ steps.sync.outputs.pushed == 'true' && steps.sync.outputs.runtime_changed == 'true' && (github.event_name == 'push' || inputs.deploy) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # whitelabel = app-wl (Smadav) then app-voodoo (Voodoo Land) in ONE run — both ship the WhiteLabel
          # branch with their own backend.env. One dispatch, so a queued run can't cancel the other.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f app=whitelabel
          echo "### 🚢 Started \"Deploy to Droplet\" for app-wl + app-voodoo — see the Actions tab" >> "$GITHUB_STEP_SUMMARY"
