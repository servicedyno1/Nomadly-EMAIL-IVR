name: Sync main → WhiteLabel

# One-click, brand-safe sync. Carries every CODE change made on `main` since the
# last sync over to the `WhiteLabel` branch (Smadav bot, app-wl), keeps every
# Smadav/brand-owned file untouched, STOPS without pushing on any real conflict,
# then redeploys app-wl through the normal "Deploy to Droplet" workflow.
#
# How to use: GitHub → Actions → "Sync main → WhiteLabel" → Run workflow.
# Logic lives in scripts/sync_whitelabel.py (testable locally with --dry-run).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only — show what would change, push nothing'
        type: boolean
        default: false
      deploy:
        description: 'Redeploy the Smadav bot (app-wl) after syncing'
        type: boolean
        default: true

permissions:
  contents: write   # push the sync commit to WhiteLabel (fast-forward only)
  actions: write    # start the "Deploy to Droplet" workflow for app-wl

concurrency:
  group: sync-whitelabel
  cancel-in-progress: false

jobs:
  sync:
    name: Sync main → WhiteLabel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch latest main + WhiteLabel
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/WhiteLabel:refs/remotes/origin/WhiteLabel

      - name: Node (for the post-merge syntax check)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync (brand-safe 3-way)
        id: sync
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          MODE_FLAG: ${{ inputs.dry_run && '--dry-run' || '--push' }}
        run: |
          python3 scripts/sync_whitelabel.py \
            --source origin/main --target origin/WhiteLabel \
            --remote origin --target-branch WhiteLabel "$MODE_FLAG"

      # Pushes made with GITHUB_TOKEN never trigger `on: push` workflows, so the
      # deploy is started explicitly (workflow_dispatch IS allowed for GITHUB_TOKEN).
      # --ref main = use main's canonical deploy.yml; deploy.sh app-wl always ships
      # the WhiteLabel branch (/opt/nomadly/shared/app-wl/branch).
      - name: Redeploy app-wl (Smadav bot)
        if: ${{ steps.sync.outputs.pushed == 'true' && steps.sync.outputs.runtime_changed == 'true' && inputs.deploy }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f app=app-wl
          echo "### 🚢 Started \"Deploy to Droplet\" for app-wl — see the Actions tab" >> "$GITHUB_STEP_SUMMARY"
