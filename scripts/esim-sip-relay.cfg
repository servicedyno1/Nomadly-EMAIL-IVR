#!KAMAILIO
# CloudIVR eSIM call relay: Spenza sends INVITEs for eSIM lines set to "Ring in CloudIVR" here;
# they are passed on to the Telnyx Call Control app (SIP subdomain). Signalling only, media goes direct.
debug=2
log_stderror=no
log_facility=LOG_LOCAL0
children=4
listen=udp:0.0.0.0:5060 advertise 146.190.238.190:5060
dns=yes
rev_dns=no
auto_aliases=no
alias="146.190.238.190"
user_agent_header="User-Agent: CloudIVR"
server_header="Server: CloudIVR"

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "pike.so"
loadmodule "tmx.so"

modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 20)
modparam("pike", "remove_latency", 4)

request_route {
	if (!pike_check_req()) { xlog("L_WARN", "esim-relay: flood from $si\n"); exit; }
	if (!mf_process_maxfwd_header("10")) { sl_send_reply("483", "Too Many Hops"); exit; }
	if (!sanity_check("1511", "7")) { exit; }
	if (is_method("OPTIONS") && uri == myself && $rU == $null) { sl_send_reply("200", "OK"); exit; }

	if (has_totag()) {
		if (loose_route()) { t_relay(); exit; }
		if (is_method("ACK")) { if (t_check_trans()) { t_relay(); } exit; }
		sl_send_reply("404", "Not here");
		exit;
	}
	if (is_method("CANCEL")) { if (t_check_trans()) { t_relay(); } exit; }
	if (!is_method("INVITE")) { sl_send_reply("405", "Method Not Allowed"); exit; }

	$var(did) = $rU;
	if ($(var(did){s.substr,0,1}) == "+") { $var(did) = $(var(did){s.substr,1,0}); }
	if ($(var(did){s.len}) == 10) { $var(did) = "1" + $var(did); }
	$var(did) = "+" + $var(did);
	if (!($var(did) =~ "^\+1[2-9][0-9]{9}$")) { xlog("L_WARN", "esim-relay: refused $rU from $si\n"); sl_send_reply("404", "Unknown number"); exit; }

	xlog("L_INFO", "esim-relay: INVITE $fU -> $var(did) from $si\n");
	record_route();
	$ru = "sip:" + $var(did) + "@cloudivresim.sip.telnyx.com";
	if (!t_relay()) { sl_reply_error(); }
	exit;
}
