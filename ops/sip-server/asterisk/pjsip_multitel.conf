; MultiTEL: INBOUND ONLY. Each MultiTEL number forwards (ringtype 1, SIP URI) to sip:<number>@188.166.34.29:5080.
; MultiTEL does not register; INVITEs arrive unauthenticated from its origination IPs (docs/view/161).
; The called number is in the request URI (and X-DID); dialplan [from-multitel] picks the brand via DIDAPP_<digits>.
[multitel]
type=endpoint
transport=transport-udp
context=from-multitel
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[multitel]
type=identify
endpoint=multitel
match=67.205.139.35
match=67.205.139.36
match=209.124.34.0/24
match=206.189.208.231
match=206.189.208.232
match=138.197.130.40
match=138.197.130.41
match=138.197.130.42
match=138.197.130.43
match=41.218.96.0/24
match=139.59.178.18
match=139.59.178.19
match=139.59.178.20
match=139.59.156.181
match=139.59.156.182
match=139.59.156.183
match=95.85.22.190
match=95.85.22.191
match=128.199.64.52
match=45.32.247.20
match=104.238.189.1
match=104.238.189.100
match=154.127.61.44
match=35.199.100.51

; MultiTEL OUTBOUND (termination) — backup trunk when Bird refuses a call (CALL_ENGINE_BACKUP_TRUNK=multitel-out).
; MultiTEL authenticates by source IP: 188.166.34.29 must be in MultiTEL portal → Profile settings → Termination IPs.
[multitel-out]
type=aor
contact=sip:term.multitel.net:5060
qualify_frequency=0

[multitel-out]
type=endpoint
transport=transport-udp
context=from-multitel
aors=multitel-out
from_domain=term.multitel.net
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
