; Telnyx SIP trunk (new Telnyx account): INBOUND ONLY. Telnyx delivers calls for its numbers to sip-tls.cloudivr.net:5061
; (FQDN connection "CloudIVR SIP server", TLS + SDES-SRTP, DNIS +E.164). Never used to place calls (outbound = Bird).
; Brand routing: dialplan [from-telnyx] reads DIDAPP_<digits> (set by each brand app over ARI).
[telnyx]
type=endpoint
transport=transport-tls
context=from-telnyx
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
media_encryption=sdes
media_encryption_optimistic=no
[telnyx]
type=identify
endpoint=telnyx
; US + CA signalling (https://sip.telnyx.com/voice.json)
match=192.76.120.10
match=64.16.250.10
match=192.76.120.31
match=64.16.250.13
match=192.76.120.14
