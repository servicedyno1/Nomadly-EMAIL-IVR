; Zadarma SIP trunk: INBOUND ONLY. Zadarma forwards calls for its numbers via SIP URI
; to sip-tls.cloudivr.net:5061. Zadarma does NOT register; calls arrive as unauthenticated
; INVITEs from their signaling IPs. Brand routing: dialplan [from-zadarma] reads DIDAPP_<digits>.
[zadarma]
type=endpoint
transport=transport-tls
context=from-zadarma
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
; Zadarma may or may not offer SRTP; be optimistic
media_encryption=sdes
media_encryption_optimistic=yes
[zadarma]
type=identify
endpoint=zadarma
; Zadarma signaling IPs for direct virtual numbers (https://docs.famulor.io/telephony/providers/zadarma)
match=185.45.152.216
match=185.45.155.33
