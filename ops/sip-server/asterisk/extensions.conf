[general]
static=yes
writeprotect=yes
[globals]
[from-sip]
; X-Ari-App picks the bot (nomadly, smadav, voodooland, proshop, nomadly-dev)
exten => _[+0-9].,1,NoOp(SIP call ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(APP=${PJSIP_HEADER(read,X-Ari-App)})
 same => n,Stasis(${IF($["${APP}"=""]?nomadly:${APP})},sip,${EXTEN},${PJSIP_HEADER(read,X-Sip-User)})
 same => n,Hangup()
; Inbound call handed to an AI agent: sip:ai.<app>.<token> (Kamailio sets X-Ari-App)
exten => _ai.,1,NoOp(AI agent leg ${EXTEN})
 same => n,Stasis(${PJSIP_HEADER(read,X-Ari-App)},sip,${EXTEN})
 same => n,Hangup()
[from-didww]
exten => _[+0-9].,1,NoOp(DIDWW call ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(APP=${DIDAPP_${FILTER(0-9,${EXTEN})}})
 same => n,Hangup()
[from-bird]
exten => _[+0-9].,1,NoOp(Bird call ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(APP=${DIDAPP_${FILTER(0-9,${EXTEN})}})
 same => n,Stasis(${IF($["${APP}"=""]?nomadly:${APP})},pstn,${EXTEN})
 same => n,Hangup()
