[general]
static=yes
writeprotect=yes
[globals]
[from-sip]
; X-Ari-App picks the bot (nomadly, smadav, voodooland, proshop, nomadly-dev)
exten => _[+0-9].,1,NoOp(SIP call ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(APP=${PJSIP_HEADER(read,X-Ari-App)})
 same => n,Stasis(${IF($["${APP}"=""]?nomadly:${APP})},sip,${EXTEN},${PJSIP_HEADER(read,X-Sip-User)})
 same => n,Hangup()
; Inbound call handed to an AI agent: sip:ai.<app>.<token> (Kamailio sets X-Ari-App)
exten => _ai.,1,NoOp(AI agent leg ${EXTEN})
 same => n,Stasis(${PJSIP_HEADER(read,X-Ari-App)},sip,${EXTEN})
 same => n,Hangup()
[from-didww]
exten => _[+0-9].,1,NoOp(DIDWW call ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(APP=${DIDAPP_${FILTER(0-9,${EXTEN})}})
 same => n,Hangup()
[from-bird]
exten => _[+0-9].,1,NoOp(Bird call ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(APP=${DIDAPP_${FILTER(0-9,${EXTEN})}})
 same => n,Stasis(${IF($["${APP}"=""]?nomadly:${APP})},pstn,${EXTEN})
 same => n,Hangup()
[from-telnyx]
exten => _[+0-9].,1,NoOp(Telnyx call ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(APP=${DIDAPP_${FILTER(0-9,${EXTEN})}})
 same => n,Stasis(${IF($["${APP}"=""]?nomadly:${APP})},pstn,${EXTEN})
 same => n,Hangup()
[from-zadarma]
exten => _[+0-9].,1,NoOp(Zadarma call ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(APP=${DIDAPP_${FILTER(0-9,${EXTEN})}})
 same => n,Stasis(${IF($["${APP}"=""]?nomadly:${APP})},pstn,${EXTEN})
 same => n,Hangup()

; Live tests only (scripts/live_feature_test.js): keep a test call up; "talk" says hello a few times so an AI agent hears a caller
[qa-hold]
exten => hold,1,Answer()
 same => n,Wait(60)
 same => n,Hangup()
exten => talk,1,Answer()
 same => n,Wait(4)
 same => n,Playback(hello-world)
 same => n,Wait(6)
 same => n,Playback(hello-world)
 same => n,Wait(20)
 same => n,Hangup()
[ce-amd]
; Call engine answering-machine detection (Bird / own engine). The leg leaves Stasis, runs AMD(), and returns with the verdict.
; AMD(initialSilence,greeting,afterGreetingSilence,totalAnalysisTime,minWordLength,betweenWordsSilence,maxWords,silenceThreshold,maxWordLength)
exten => detect,1,AMD(2500,1500,800,5000,100,50,3,256,5000)
 same => n,Stasis(${CE_APP},amd,${AMDSTATUS},${AMDCAUSE})
 same => n,Hangup()
; Machine: wait for the end of the greeting / beep (1.2 s of silence, at most 25 s) before the message is played.
exten => greeting,1,WaitForSilence(1200,1,25)
 same => n,Stasis(${CE_APP},amd,GREETING_END,${WAITSTATUS})
 same => n,Hangup()
