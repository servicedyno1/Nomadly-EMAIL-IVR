#!KAMAILIO
# Brand SIP server: softphones register at their brand address (sip.speechcue.com, sip.smadavspeech.com, …),
# passwords come from each bot (/sip-auth), calls go to SignalWire (per-brand domain app), and SignalWire
# rings softphones through here. Media is relayed by rtpengine so NAT'd phones work.
#!substdef "!MY_IP!__MY_IP__!g"
#!substdef "!SIP_KEY!__SIP_KEY__!g"

#!define FLT_NATS 5
#!define FLB_NATB 6
#!define FLB_NATSIPPING 7

debug=2
log_stderror=no
log_facility=LOG_LOCAL0
children=4
tcp_children=2
listen=udp:MY_IP:5060
listen=tcp:MY_IP:5060
tcp_connection_lifetime=3605
auto_aliases=no
alias="sip.speechcue.com"
alias="sip.cloudivr.net"
alias="sip.smadavspeech.com"
alias="sip.voodooivr.xyz"
alias="sip.proshopivr.xyz"
alias="sip-test.cloudivr.net"
alias="MY_IP"
server_header="Server: CloudIVR SIP"
user_agent_header="User-Agent: CloudIVR SIP"

loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "cfgutils.so"
loadmodule "auth.so"
loadmodule "htable.so"
loadmodule "http_client.so"
loadmodule "nathelper.so"
loadmodule "rtpengine.so"
loadmodule "pike.so"
loadmodule "db_text.so"
loadmodule "uac.so"

modparam("jsonrpcs", "pretty_format", 1)
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 60000)
modparam("rr", "enable_full_lr", 0)
modparam("rr", "append_fromtag", 1)
modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_expires", 3600)
modparam("registrar", "default_expires", 600)
modparam("registrar", "gruu_enabled", 0)
modparam("usrloc", "db_mode", 0)
modparam("usrloc", "use_domain", 0)
modparam("usrloc", "nat_bflag", FLB_NATB)
modparam("nathelper|registrar", "received_avp", "$avp(RECEIVED)")
modparam("nathelper", "natping_interval", 30)
modparam("nathelper", "ping_nated_only", 1)
modparam("nathelper", "sipping_bflag", FLB_NATSIPPING)
modparam("nathelper", "sipping_from", "sip:pinger@MY_IP")
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:2223")
modparam("htable", "htable", "pw=>size=10;autoexpire=300;")
modparam("htable", "htable", "bad=>size=8;autoexpire=900;")
modparam("http_client", "connection_timeout", 4)
modparam("http_client", "keep_connections", 1)
# Registers "sipbridge" to SignalWire so SignalWire can reach this server when ringing softphones
modparam("uac", "reg_db_url", "text:///etc/kamailio/dbtext")
modparam("uac", "reg_contact_addr", "MY_IP:5060")
modparam("uac", "reg_timer_interval", 30)
modparam("uac", "reg_retry_interval", 60)
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 30)

request_route {
	route(REQINIT);
	route(NATDETECT);

	if (is_method("CANCEL")) {
		if (t_check_trans()) { route(RELAY); }
		exit;
	}
	if (!is_method("ACK")) {
		if (t_precheck_trans()) { t_check_trans(); exit; }
		t_check_trans();
	}
	route(WITHINDLG);

	remove_hf("Route");
	if (is_method("INVITE|SUBSCRIBE")) { record_route(); }

	if (is_method("OPTIONS") && ($rU == $null || uri == myself)) { sl_send_reply("200", "OK"); exit; }
	if (is_method("REGISTER")) { route(AUTH); route(REGISTRAR); exit; }

	# SignalWire ringing a softphone (key added by the bots' SignalWire adapter)
	if (is_method("INVITE") && $hdr(X-Nomadly-Key) == "SIP_KEY") {
		remove_hf("X-Nomadly-Key");
		if ($hdr(X-Nomadly-User) != $null) { $rU = $hdr(X-Nomadly-User); remove_hf("X-Nomadly-User"); }
		# Inbound call handed to an AI agent (sip:ai.<app>.<token>) → our call engine, which streams it to the bot
		if ($rU =~ "^ai\\.") { remove_hf("X-Nomadly-Domain"); route(AI_ENGINE); }
		# The softphone only ever sees the brand address, never the carrier's
		$var(bd) = "sip.speechcue.com";
		if ($hdr(X-Nomadly-Domain) != $null) { $var(bd) = $hdr(X-Nomadly-Domain); remove_hf("X-Nomadly-Domain"); }
		if ($fd =~ "signalwire") { uac_replace_from("", "sip:$fU@$var(bd)"); }
		if ($td =~ "signalwire") { uac_replace_to("", "sip:$rU@$var(bd)"); }
		remove_hf("P-Asserted-Identity"); remove_hf("Remote-Party-ID");
		route(LOCATION);
		exit;
	}

	if (is_method("INVITE")) { route(AUTH); if ($rU =~ "^\\*99") { $rU = $(rU{s.substr,3,0}); route(TO_ENGINE); } route(TO_SIGNALWIRE); exit; }
	sl_send_reply("405", "Method Not Allowed");
	exit;
}

route[RELAY] {
	if (is_method("INVITE|BYE|UPDATE|ACK")) { t_on_reply("MANAGE_REPLY"); }
	if (is_method("INVITE")) { t_on_branch("MANAGE_BRANCH"); t_on_failure("MANAGE_FAILURE"); }
	if (!t_relay()) { sl_reply_error(); }
	exit;
}

route[REQINIT] {
	if (!is_method("OPTIONS|ACK|BYE|CANCEL") && !pike_check_req()) { exit; }
	if ($sht(bad=>$si) > 15) { exit; }
	if (!mf_process_maxfwd_header("10")) { sl_send_reply("483", "Too Many Hops"); exit; }
	if (!sanity_check("17895", "7")) { exit; }
	if ($ua =~ "friendly-scanner|sipcli|sipvicious|VaxSIPUserAgent|pplsip") { exit; }
}

route[NATDETECT] {
	force_rport();
	if (nat_uac_test("19")) {
		if (is_method("REGISTER")) { fix_nated_register(); }
		else if (is_first_hop()) { set_contact_alias(); }
		setflag(FLT_NATS);
	}
}

route[WITHINDLG] {
	if (!has_totag()) return;
	if (loose_route()) {
		if (!isdsturiset()) { handle_ruri_alias(); }
		if (is_method("BYE")) { rtpengine_delete(); }
		else if (is_method("ACK") && has_body("application/sdp")) { rtpengine_manage("replace-origin replace-session-connection"); }
		route(RELAY);
		exit;
	}
	if (is_method("ACK")) {
		if (t_check_trans()) { route(RELAY); exit; }
		exit;
	}
	sl_send_reply("404", "Not here");
	exit;
}

# Brand of the softphone's address → the bot that owns it
route[BRAND] {
	switch ($fd) {
		case "sip.smadavspeech.com":
			$var(api) = "https://1.smadavspeech.com"; $var(sw) = "cloudivr-smadav"; break;
		case "sip.voodooivr.xyz":
			$var(api) = "https://voodooivr.xyz"; $var(sw) = "cloudivr-voodooland"; break;
		case "sip.proshopivr.xyz":
			$var(api) = "https://proshopivr.xyz"; $var(sw) = "cloudivr-proshop"; break;
		case "sip-test.cloudivr.net":
			$var(api) = "__TEST_API__"; $var(sw) = "cloudivr-nomadly-dev"; break;
		default:
			$var(api) = "https://2.speechcue.com"; $var(sw) = "cloudivr-nomadly";
	}
}

route[AUTH] {
	route(BRAND);
	if (!is_present_hf("Authorization") && !is_present_hf("Proxy-Authorization")) {
		if (is_method("REGISTER")) { www_challenge("$fd", "0"); } else { proxy_challenge("$fd", "0"); }
		exit;
	}
	$var(key) = $fd + ":" + $au;
	if ($sht(pw=>$var(key)) == $null) {
		$var(code) = http_client_query("$var(api)/sip-auth/$au", "", "X-Sip-Key: SIP_KEY", "$var(res)");
		if ($var(code) == 200) { $sht(pw=>$var(key)) = $var(res); }
		else { $sht(pw=>$var(key)) = "!" + $RANDOM; xlog("L_INFO", "auth lookup $au@$fd -> $var(code)\n"); }
	}
	if (!pv_auth_check("$fd", "$sht(pw=>$var(key))", "0", "0")) {
		$sht(bad=>$si) = $sht(bad=>$si) + 1;
		xlog("L_NOTICE", "auth failed $au@$fd from $si\n");
		if (is_method("REGISTER")) { www_challenge("$fd", "0"); } else { proxy_challenge("$fd", "0"); }
		exit;
	}
	# REGISTER is always filed under the login it authenticated with; softphones may put a label or caller ID in To.
	$var(aor) = "sip:" + $au + "@" + $fd;
	consume_credentials();
}

route[REGISTRAR] {
	if (isflagset(FLT_NATS)) { setbflag(FLB_NATB); setbflag(FLB_NATSIPPING); }
	if (!save("location", "0x00", "$var(aor)")) { sl_reply_error(); }
	exit;
}

route[LOCATION] {
	if (!lookup("location")) {
		$var(rc) = $rc;
		t_newtran();
		switch ($var(rc)) {
			case -1:
			case -3:
				send_reply("480", "Temporarily Unavailable"); exit;
			case -2:
				send_reply("405", "Method Not Allowed"); exit;
		}
	}
	if (has_body("application/sdp")) { rtpengine_manage("replace-origin replace-session-connection ICE=remove RTP/AVP"); }
	route(RELAY);
}

# Our own call engine (Asterisk on this server) — used directly for *99 test calls and when SignalWire refuses a call
route[TO_ENGINE] {
	$ru = "sip:" + $rU + "@MY_IP:5080";
	$du = $null;
	remove_hf("X-Ari-App"); remove_hf("X-Sip-User");
	append_hf("X-Ari-App: $(var(sw){s.substr,9,0})\r\nX-Sip-User: $au\r\n");
	if (has_body("application/sdp")) { rtpengine_manage("replace-origin replace-session-connection ICE=remove RTP/AVP"); }
	route(RELAY);
}

route[AI_ENGINE] {
	$var(app) = $(rU{s.select,1,.});
	$ru = "sip:" + $rU + "@MY_IP:5080";
	$du = $null;
	remove_hf("X-Ari-App");
	append_hf("X-Ari-App: $var(app)\r\n");
	if (has_body("application/sdp")) { rtpengine_manage("replace-origin replace-session-connection ICE=remove RTP/AVP"); }
	route(RELAY);
}

route[TO_SIGNALWIRE] {
	$avp(dialed) = $rU;
	$avp(app) = $(var(sw){s.substr,9,0});
	$avp(sipuser) = $au;
	$ru = "sip:" + $rU + "@" + $var(sw) + ".dapp.signalwire.com";
	$du = $null;
	setflag(8);
	append_hf("X-Sip-User: $au\r\n");
	if (has_body("application/sdp")) { rtpengine_manage("replace-origin replace-session-connection ICE=remove RTP/AVP"); }
	route(RELAY);
}

branch_route[MANAGE_BRANCH] {
	if (isbflagset(FLB_NATB)) { set_contact_alias(); }
}

onreply_route[MANAGE_REPLY] {
	if (status =~ "[12][0-9][0-9]") {
		if (nat_uac_test("19")) { set_contact_alias(); }
		if (has_body("application/sdp")) { rtpengine_manage("replace-origin replace-session-connection ICE=remove RTP/AVP"); }
	}
}

failure_route[MANAGE_FAILURE] {
	if (t_is_canceled()) { rtpengine_delete(); exit; }
	# SignalWire refused (rate limit, outage…) → our own call engine takes the call
	if (isflagset(8) && t_check_status("[45][0-9][0-9]")) {
		resetflag(8);
		xlog("L_NOTICE", "SignalWire refused $avp(dialed) for $avp(sipuser) ($T_reply_code) -> call engine\n");
		$ru = "sip:" + $avp(dialed) + "@MY_IP:5080";
		$du = $null;
		remove_hf("X-Sip-User");
		append_hf("X-Ari-App: $avp(app)\r\nX-Sip-User: $avp(sipuser)\r\n");
		t_on_reply("MANAGE_REPLY");
		t_relay();
	}
}
