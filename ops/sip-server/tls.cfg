# Kamailio TLS for softphones on 5061 — Let's Encrypt cert "sip-brands" (all 5 brand SIP domains), copied by the certbot deploy hook.
[server:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
private_key = /etc/kamailio/certs/privkey.pem
certificate = /etc/kamailio/certs/fullchain.pem

[client:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
