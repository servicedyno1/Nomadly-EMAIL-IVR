# Local plain-HTTP door for Kamailio's password / presence lookups (/sip-auth, /sip-registered).
# nginx does the HTTPS to each bot, so Kamailio's SIP workers never run OpenSSL through libcurl
# (kamailio 5.7.4 + tls module + OpenSSL 3: libcurl TLS inside workers hung and segfaulted them, 2026-11-18).
# Install: /etc/nginx/conf.d/sip-api-proxy.conf (remove sites-enabled/default). Ports are loopback only.
resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
map $server_port $sip_api_host {
    8181 2.speechcue.com;
    8182 1.smadavspeech.com;
    8183 voodooivr.xyz;
    8184 proshopivr.xyz;
    8185 c4ea8f4e-6caa-4734-adf8-0f01a828b5c7.preview.emergentagent.com;
}
server {
    listen 127.0.0.1:8181; listen 127.0.0.1:8182; listen 127.0.0.1:8183; listen 127.0.0.1:8184; listen 127.0.0.1:8185;
    access_log off;
    location ~ ^(/api)?/sip-(auth|registered)/ {
        proxy_pass https://$sip_api_host;
        proxy_ssl_server_name on;
        proxy_ssl_name $sip_api_host;
        proxy_set_header Host $sip_api_host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 4s;
        proxy_send_timeout 3s;
    }
    location / { return 404; }
}
